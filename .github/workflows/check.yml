name: Verify DAY DAW REC code
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Verify D1 migrations
        run: python3 tests/test_migration.py
      - name: Verify real Worker auth contract with fake D1 and Twilio
        run: node --experimental-strip-types --test tests/native_auth.test.mjs
      - name: Build app
        run: npm run build
